map $http_upgrade $omniroute_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    listen [::]:80;
    server_name fitoway.tech www.fitoway.tech;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://fitoway.tech$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.fitoway.tech;
    ssl_certificate /etc/letsencrypt/live/fitoway.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitoway.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://fitoway.tech$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fitoway.tech;
    ssl_certificate /etc/letsencrypt/live/fitoway.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitoway.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OmniRouteTLS:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 64m;
    access_log /var/log/nginx/omniroute.access.log;
    error_log /var/log/nginx/omniroute.error.log;
    location / {
        proxy_pass http://127.0.0.1:20128;
        proxy_http_version 1.1;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded '';
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $omniroute_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
