# Keep every scanner check active; narrow the additional rejection status to the
# operation whose real pre-auth body guard and response contract are tested.
hooks = "scripts/check/dast-body-size-contract.py"

[[operations]]
include-name = "POST /api/keys/{id}/access"
checks.negative_data_rejection.expected-statuses = [
  400, 401, 403, 404, 405, 406, 409, 413, 415, 422, 428, 429, "5xx",
]
