# .gitleaks.toml — gitleaks configuration for OmniRoute
# Task 7.18 — PLANO-QUALITY-GATES-FASE7.md
#
# Extends the default gitleaks rules with project-specific allowlists.
#

#   Legitimate findings (test fixtures, public OAuth creds already covered by
#   check-public-creds.mjs, example values in docs) must be recorded below
#   in [[allowlist]] with a mandatory explanatory comment.
#
#   Do NOT add an allowlist entry without justification. Each entry is reviewed
#   every release (stale-enforcement). Rule: if the finding is a real value that the
#   system uses in production, it is a true positive — do not allowlist it, fix it.
#

#             CLAUDE.md Hard Rule #11 (resolvePublicCred required)

# Inherit ALL default gitleaks rules. WARNING: a custom config

# rules — gitleaks REPLACES the default ruleset with the file, it does not extend it
# automatically. Without this section, `gitleaks --config .gitleaks.toml` never
# detecta nada (todo finding vira 0), tornando o gate inerte. Com useDefault,
# the allowlist below is applied ON TOP OF the ~170 default rules.
[extend]
  useDefault = true

# To disable a specific rule, use:
# [[rules]]
#   id = "rule-id"
#   [rules.allowlist]
#     description = "..."

# ---------------------------------------------------------------------------
# Allowlist global do projeto

# ---------------------------------------------------------------------------
[allowlist]
  description = "OmniRoute project-level allowlist — fixtures, test vectors, public OAuth creds"

  # Paths a ignorar completamente (node_modules, builds, etc.)
  paths = [
    '''node_modules''',
    '''\.next''',
    '''dist''',
    '''\.git''',
    '''coverage''',
    '''\.nyc_output''',
  ]

  
  # commits = []

  # Stopword regexes — lines containing these patterns are ignored.
  # Use only for proven false positives with justification below.
  # stopwords = []

  # Target regexes (file paths) that can be allowlisted per rule.
  # See the per-rule [[allowlist]] below for granularity.

# ---------------------------------------------------------------------------
# Per-rule allowlist (add as needed during the stale review)
# ---------------------------------------------------------------------------
#
# Example (REMOVE / REPLACE with real entries when needed):
#
# [[rules]]
#   # Allowlist test fixtures containing example/invalid OAuth tokens
#   # Added: 2026-06-13 | Review by: v3.9.0 | Justification: non-real test values
#   id = "github-fine-grained-pat"
#   [rules.allowlist]
#     description = "Test fixture PATs — synthetic, non-functional values"
#     paths = [
#       '''tests/fixtures/''',
#       '''tests/unit/''',
#     ]
#

[[rules]]
  # Falsos-positivos comprovados do generic-api-key — zerados em 2026-07-13 (WS6/D3,
  
  
  # of Anthropic (publicly documented, not a secret).
  id = "generic-api-key"
  [rules.allowlist]
    description = "Field names + public Anthropic beta-header value (not secrets)"
    regexes = [
      '''latencyP\d{2}Ms''',
      '''interleaved-thinking-2025-05-14''',
      # v3.8.49 pre-flight (2026-07-28). Nenhum dos dois e credencial:
      # - localStorage key of the sponsorship banner (#8723; #10200 bumped v1->v2,
      #   generalizado para -v\d+ no round 3 de base-reds #9985), so um identificador de UI;
      # - x-api-key PUBLICO do Firefly web (documentado em open-sse/utils/publicCreds.ts:207);
      #   both flagged occurrences are in JSDoc COMMENTS; runtime reads from resolvePublicCred().
      '''omniroute-kimi-sponsor-banner-dismissed-v\d+''',
      # CheaperInference sponsor banner localStorage key (upstream #11196 /
      # eb5797370). Same UI-identifier pattern as the kimi banner above, not a
      # credential; the generic-api-key rule flags the long hyphenated string.
      '''omniroute-cheaperinference-sponsor-banner-dismissed-v\d+''',
      '''SunbreakWebUI1''',
      # Uzbek dashboard catalog (#13727, src/i18n/messages/uz.json `outputTokenDesc`):
      # "Yakunlash/javob tokenlari" = "completion/response tokens". The rule reads the
      # `...TokenDesc` key as a token assignment and the translated words as its value.
      '''Yakunlash/javob''',
      # Feature-flag id from #13439 (src/shared/constants/featureFlagDefinitions.ts):
      # `key: "PROTECTED_PRIORITY_INFRA_502_ENABLED"` is a flag name, not a credential.
      '''PROTECTED_PRIORITY_INFRA_502_ENABLED''',
    ]
