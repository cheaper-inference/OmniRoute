name: Nightly CodeQL Inventory
on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  inventory:
    if: ${{ github.repository == 'cheaper-inference/OmniRoute' }}
    name: Repository CodeQL inventory (global baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version-file: .node-version
      # Measurement only; this never dispatches an advanced CodeQL analysis.
      - name: Measure repository alerts without relaxing the baseline
        run: npm run check:codeql-ratchet -- --strict-measurement
        env:
          GH_TOKEN: ${{ github.token }}
