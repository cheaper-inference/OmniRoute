name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Publish to Docker Hub"]
    types: [completed]
  workflow_dispatch:

# Serialize VPS deployments onto the single target host so overlapping
# workflow_run / workflow_dispatch executions cannot race global `npm install -g`,
# `INSTALLED_VERSION` verification, and `pm2 delete` / `pm2 start` (#21014).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.id == github.event.repository.id &&
        contains(fromJSON('["push","release","workflow_dispatch"]'), github.event.workflow_run.event) &&
        (github.event.workflow_run.head_branch == 'main' ||
         startsWith(github.event.workflow_run.head_branch, 'release/v') ||
         startsWith(github.event.workflow_run.head_branch, 'v'))))
      && vars.DEPLOY_ENABLED == 'true'
      && !startsWith(github.event.workflow_run.head_branch, 'omni-queue/') && !startsWith(github.ref, 'refs/heads/omni-queue/')
    name: Deploy OmniRoute to VPS
    runs-on: ubuntu-latest
    # Bound a hung SSH session to an hour instead of GitHub's 6-hour default; the deploy
    # itself fails fast when the VPS is unreachable (run 39101148517: 0 min of work).
    timeout-minutes: 60
    steps:
      - name: Check VPS SSH reachability from runner
        id: reach
        env:
          # Pass the host via env (never interpolate a secret straight into the
          # script body) so /dev/tcp gets a shell variable, not inlined text.
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          # A GitHub-hosted runner can only deploy when it can actually open a TCP
          # connection to the VPS SSH port. The Local VPS lives on a private LAN and
          # the Akamai host firewalls :22 to known IPs, so the runner is routinely
          # unable to reach it. An enabled deployment that cannot start is a failed
          # deployment, not success. Keep DEPLOY_ENABLED=false when this runner has
          # no authorized route; do not convert a requested deployment into green.
          if timeout 15 bash -c 'exec 3<>"/dev/tcp/${VPS_HOST}/22"' 2>/dev/null; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "✅ VPS_HOST:22 reachable from the runner — proceeding with deploy."
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Deployment did not start::VPS_HOST:22 is not reachable from this runner. An operator must provide an authorized route or perform a separately authorized deployment."
            exit 1
          fi

      - name: Resolve expected OmniRoute version
        if: steps.reach.outputs.reachable == 'true'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Read package.json via the GitHub Contents API instead of checking out
          # workflow_run code (preserves the .zizmor.yml dangerous-triggers invariant).
          TARGET_SHA="${DISPATCH_SHA}"
          if [ "${EVENT_NAME}" = "workflow_run" ] && [ -n "${WORKFLOW_RUN_SHA}" ]; then
            TARGET_SHA="${WORKFLOW_RUN_SHA}"
          fi
          EXPECTED=$(gh api "repos/${REPO}/contents/package.json?ref=${TARGET_SHA}" \
            | node -e 'const fs = require("node:fs"); const body = JSON.parse(fs.readFileSync(0, "utf8")); const pkg = JSON.parse(Buffer.from(body.content, "base64").toString("utf8")); if (typeof pkg.version !== "string") process.exit(1); process.stdout.write(pkg.version.trim());')
          if [[ "${EXPECTED}" == *$'\n'* || "${EXPECTED}" == *$'\r'* ]] || ! [[ "${EXPECTED}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            SAFE_EXPECTED="${EXPECTED//$'\r'/\\r}"
            SAFE_EXPECTED="${SAFE_EXPECTED//$'\n'/\\n}"
            echo "::error title=Invalid expected version::Resolved invalid package.json version '${SAFE_EXPECTED}' from ${TARGET_SHA}"
            exit 1
          fi
          echo "expected=${EXPECTED}" >> "$GITHUB_OUTPUT"
          echo "Resolved expected OmniRoute version ${EXPECTED} from ${TARGET_SHA}"

      - name: Deploy via SSH
        if: steps.reach.outputs.reachable == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.expected }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          envs: EXPECTED_VERSION
          script: |
            set -euo pipefail

            if [ -z "${EXPECTED_VERSION:-}" ]; then
              echo "❌ EXPECTED_VERSION is empty — refusing unpinned install"
              exit 1
            fi
            echo "=== Updating OmniRoute to ${EXPECTED_VERSION} ==="
            npm install -g "omniroute@${EXPECTED_VERSION}"
            INSTALLED_VERSION=$(omniroute --version 2>/dev/null | tr -d '[:space:]' || echo "unknown")
            echo "Installed CLI version: $INSTALLED_VERSION (expected: $EXPECTED_VERSION)"
            if [ "$INSTALLED_VERSION" != "$EXPECTED_VERSION" ]; then
              echo "❌ Installed CLI version ($INSTALLED_VERSION) does not match expected version ($EXPECTED_VERSION)"
              exit 1
            fi

            # Recreate the PM2 process instead of `pm2 restart`. A bare restart
            # re-runs whatever script path was saved earlier; after the build-output
            # reorg (app/ -> dist/, .next -> .build/next) a process pinned to the old
            # app/server-ws.mjs path can no longer start, and the node process dies
            # while PM2 still reports "online" — so the box never binds :20128.
            # Always launch via the `omniroute` bin so .env is loaded and the dist/
            # layout is resolved correctly.
            echo "=== (Re)creating PM2 process via bin ==="
            pm2 delete omniroute 2>/dev/null || true
            pm2 start omniroute --name omniroute -- --port 20128
            pm2 save

            # Health gate: fail the deploy unless the box actually reports healthy.
            # Poll /api/monitoring/health for "status":"healthy" (a deeper signal than
            # a static page 200 — it confirms the app booted, not just that a port is
            # bound). Boot can take a while after a native-module/build-layout change,
            # so poll up to ~3min before giving up.
            echo "=== Health Check (gates the deploy) ==="
            ok=0
            for i in $(seq 1 36); do
              BODY=$(curl -sf -m 5 http://localhost:20128/api/monitoring/health 2>/dev/null || true)
              if printf '%s' "$BODY" | grep -q '"status":"healthy"'; then
                ok=1
                echo "✅ /api/monitoring/health -> healthy (attempt $i) — version $INSTALLED_VERSION"
                break
              fi
              echo "… not healthy yet (attempt $i/36), retrying in 5s"
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "❌ Health check failed — /api/monitoring/health never reported healthy after ~3min"
              echo "--- recent PM2 logs ---"
              pm2 logs omniroute --lines 40 --nostream || true
              exit 1
            fi
            echo "=== Deploy complete ==="
