name: omni-queue

# OmniRoute's own merge queue (docs/ops/OMNI_QUEUE.md). One idempotent tick composes the next
# batch of approved PRs on top of a release branch, pushes it as a fresh omni-queue/** candidate
# (ci.yml + quality.yml run their full profile there), reads the candidate's checks and lands it
# (or, in shadow mode, records what it would land). State lives on the omni-queue-state branch.
#
# Security posture (also the .zizmor.yml justification for pull_request_target/workflow_run):
#   • No job ever checks out or runs PR code. Both jobs check out the DEFAULT branch (sparse:
#     scripts/merge-queue + config/merge-queue only) and run zero-dependency Node scripts —
#     no npm ci, no third-party install scripts next to the App token. The queue touches PR
#     content only as git objects (merge-tree/commit-tree in a scratch bare repository).
#   • Which copy of THIS file runs: schedule, workflow_run and pull_request_target use the
#     default branch's copy (pull_request_target has done so since 2025-12-08, whatever the PR's
#     base); workflow_dispatch uses the dispatched ref. The scripts ALWAYS come from the default
#     branch (explicit checkout ref), so nothing works until scripts/merge-queue is there.
#   • Public repositories block pull_request_target by default from 2026-12-02 unless an Actions
#     policy allows this workflow file (docs/ops/OMNI_QUEUE.md → "Actions event policy"). A
#     blocked approval job fails closed: no approval status, so nothing becomes eligible.
#   • Writes use a GitHub App installation token minted per job with the minimum permissions
#     (the GITHUB_TOKEN cannot be used: refs it pushes do not trigger the candidate's CI).
#   • Both jobs run in the `omni-queue` environment, which holds the App's credentials and the
#     owner's OMNI_QUEUE_LAND_TOKEN and admits the default branch only, by its exact name: a
#     workflow on a candidate branch cannot read them. The App writes omni-queue/land, the status release rulesets
#     require, so its private key is the root of trust. The land token reaches the tick only.
#   • action=bless (the explicit emergency exit): the tick writes omni-queue/land on ONE commit
#     for a hotfix, sync-back or base repair, after checking that the dispatcher
#     (github.triggering_actor) is in config.approvers; the maintainer then lands it himself.
#   • Kill switch: every job is inert unless the repository variable OMNI_QUEUE_ENABLED is
#     'true'. Forks never inherit repository variables.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Release branch to act on (default: every managed base with queue work)"
        required: false
        type: string
      action:
        description: "tick = one normal tick; pause/resume = toggle a base; dry-run = decide and print, write nothing; bless = write omni-queue/land on one commit (needs base, sha, reason)"
        required: false
        default: tick
        type: choice
        options:
          - tick
          - pause
          - resume
          - dry-run
          - bless
      reason:
        description: "Free-text reason recorded with pause/resume/bless (required for bless)"
        required: false
        type: string
      sha:
        description: "bless only: full 40-hex SHA of the commit that receives omni-queue/land"
        required: false
        type: string
  # A candidate's CI finished: tick right away instead of waiting for the next cron slot.
  workflow_run:
    workflows: ["CI", "Quality Gates"]
    types: [completed]
    branches: ["omni-queue/**"]
  # Label changes bind/withdraw approvals (job `approval`); the listed actions wake the tick.
  # This trigger fires for EVERY pull request, and each job mints an App token: the jobs' `if:`
  # keep only the events the queue cares about (see both jobs).
  pull_request_target:
    types: [labeled, unlabeled, synchronize, closed]

permissions: {}

jobs:
  # Binds a label approval to the exact head SHA (commit status omni-queue/approval or
  # omni-queue/protected-approval). Deliberately outside the tick's concurrency group: GitHub
  # replaces a pending run of a group, and an approval must never be dropped that way. Its own
  # group is keyed on PR AND label: two runs for the same label never interleave their label
  # re-read and status write (a stale `failure` after a newer `success`), and a pending run can
  # only be replaced by a newer event on the same label, whose run re-reads the current labels.
  # An unrelated label (skipped by the `if:` below), or the other approval label, has its own
  # group and replaces nothing.
  # (github.event.number = the PR number of a pull_request_target payload.)
  #
  # Only the two approval labels start it (`label` and `protectedApprovalLabel` of
  # config/merge-queue/config.json). An `if:` cannot read that file, so the names are repeated
  # here: rename a label in BOTH places (tests/unit/merge-queue/workflows.test.mjs compares them).
  # Only pull requests into a release/v* branch: the queue manages release bases only, and the
  # filter keeps the job from minting an App token for every other pull request.
  approval:
    name: Approval
    if: >-
      vars.OMNI_QUEUE_ENABLED == 'true'
      && (github.event_name != 'schedule' || github.repository == 'cheaper-inference/OmniRoute')
      && github.event_name == 'pull_request_target'
      && startsWith(github.event.pull_request.base.ref, 'release/v')
      && (github.event.action == 'labeled' || github.event.action == 'unlabeled')
      && (github.event.label.name == 'omni-queue' || github.event.label.name == 'protected-approved')
    runs-on: ubuntu-latest
    # Secrets and branch policy of the environment, without a deployment record per run.
    environment:
      name: omni-queue
      deployment: false
    timeout-minutes: 5
    concurrency:
      group: omni-queue-approval-${{ github.event.number }}-${{ github.event.label.name }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Mint the omni-queue App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.OMNI_QUEUE_APP_ID }}
          private-key: ${{ secrets.OMNI_QUEUE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-issues: write
          permission-statuses: write
      # The default branch's orchestrator, never the PR's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/merge-queue
            config/merge-queue
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: "24"
      - name: Bind the label to the head SHA
        env:
          OMNI_QUEUE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/merge-queue/approve.mjs

  tick:
    name: Tick
    needs: approval
    # !cancelled() (not always()): the approval job is skipped on every event but an approval
    # label change, and an operator who cancels the run mid-incident must stop the tick too.
    #
    # A pull request event starts a tick only when it can change what the queue does: the
    # event's label is an approval label or one of config.json's `blockLabels`, the pull request
    # carries the queue label, or a merge moved a base. Anything else (a label on, or a push to,
    # a pull request that is not queued) starts nothing; the 5-minute cron stays the safety net.
    # Same label literals as config/merge-queue/config.json: rename in BOTH places. And only a
    # pull request into a release/v* branch, like the approval job: the queue manages release
    # bases only, and no App token is minted for any other pull request.
    if: >-
      !cancelled()
      && vars.OMNI_QUEUE_ENABLED == 'true'
      && (github.event_name != 'schedule' || github.repository == 'cheaper-inference/OmniRoute')
      && (needs.approval.result == 'success' || needs.approval.result == 'skipped')
      && (github.event_name != 'pull_request_target'
        || (startsWith(github.event.pull_request.base.ref, 'release/v')
          && (github.event.label.name == 'omni-queue'
            || github.event.label.name == 'protected-approved'
            || github.event.label.name == 'hold'
            || github.event.label.name == 'hold-vps'
            || github.event.label.name == 'do-not-merge'
            || github.event.label.name == 'wip'
            || contains(github.event.pull_request.labels.*.name, 'omni-queue')
            || (github.event.action == 'closed' && github.event.pull_request.merged == true))))
    runs-on: ubuntu-latest
    # Secrets and branch policy of the environment, without a deployment record per run.
    environment:
      name: omni-queue
      deployment: false
    timeout-minutes: 30
    # ONE writer of queue state at a time, across every base and every trigger. Never cancel a
    # running tick (it may be between a push and the state save that records it); GitHub keeps
    # at most one pending tick, which is all a level-triggered tick needs.
    concurrency:
      group: omni-queue-tick
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Mint the omni-queue App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.OMNI_QUEUE_APP_ID }}
          private-key: ${{ secrets.OMNI_QUEUE_APP_PRIVATE_KEY }}
          permission-contents: write
          # GitHub refuses a push by an App token that creates or updates a file under
          # .github/workflows/ without this scope. A candidate's merge commits (parent 1 = base)
          # and the fast-forward landing carry any workflow change of a batched PR — ci.yml and
          # quality.yml change almost daily here — so without it every such batch fails to push.
          permission-workflows: write
          permission-pull-requests: write
          permission-issues: write
          # omni-queue/land: on a candidate or the PR heads before a landing, on one commit for a
          # bless, and withdrawn (failure) when a landing does not complete.
          permission-statuses: write
          permission-checks: read
          permission-actions: read
      # The default branch's orchestrator, never the PR's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/merge-queue
            config/merge-queue
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: "24"
      # The App's bot user (<id>+<slug>[bot] noreply). It authors queue merge commits unless
      # config.landing.actor is "owner" (then landing.identity does: tick.createTickDeps).
      - name: Resolve the bot identity
        id: identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          if [[ ! "$APP_SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::unexpected App slug"; exit 1
          fi
          login="${APP_SLUG}[bot]"
          id="$(gh api "/users/${login}" --jq .id)"
          if [[ ! "$id" =~ ^[0-9]+$ ]]; then
            echo "::error::could not resolve the user id of ${login}"; exit 1
          fi
          {
            echo "name=${login}"
            echo "email=${id}+${login}@users.noreply.github.com"
          } >> "$GITHUB_OUTPUT"
      # Inputs travel through env and are assembled into an argv array: no expression is ever
      # expanded inside the script body. Scheduled, workflow_run and pull_request_target ticks
      # pass no base (the tick discovers the bases with work). The owner's land token is used
      # only by the landing itself when config.landing.actor is "owner" (never printed).
      # GITHUB_TRIGGERING_ACTOR is the runner's own default variable, named here because a
      # bless is checked against it (the dispatcher, or whoever re-ran the run).
      - name: Run one queue tick
        env:
          OMNI_QUEUE_TOKEN: ${{ steps.app-token.outputs.token }}
          OMNI_QUEUE_LAND_TOKEN: ${{ secrets.OMNI_QUEUE_LAND_TOKEN }}
          OMNI_QUEUE_BOT_NAME: ${{ steps.identity.outputs.name }}
          OMNI_QUEUE_BOT_EMAIL: ${{ steps.identity.outputs.email }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_REASON: ${{ inputs.reason }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          args=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_BASE:-}" ]; then args+=(--base "$INPUT_BASE"); fi
            args+=(--action "${INPUT_ACTION:-tick}")
            if [ -n "${INPUT_REASON:-}" ]; then args+=(--reason "$INPUT_REASON"); fi
            if [ -n "${INPUT_SHA:-}" ]; then args+=(--sha "$INPUT_SHA"); fi
          fi
          node scripts/merge-queue/tick.mjs "${args[@]}"
