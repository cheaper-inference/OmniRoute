name: Mirror Docker image to the Docker Hub org

# Copies a published release from ghcr.io/cheaper-inference/omniroute to the Cheaper Inference
# Docker Hub organization (cheaperinference/omniroute). The legacy diegosouzapw/omniroute keeps
# receiving the same images from docker-publish.yml: Docker Hub cannot move a repository between
# namespaces, so its pull history stays there and both are published in parallel.
#
# Two entry points:
#   - workflow_call from docker-publish.yml, right after a release's manifests are created;
#   - workflow_dispatch to (re)publish an already released version to the org only, for example
#     once the org owner provides the credentials. It copies the existing images and does not
#     rebuild anything (minutes, not the ~2 h of a docker-publish dispatch).
#
# Without the DOCKERHUB_ORG_USERNAME / DOCKERHUB_ORG_TOKEN secrets the job skips with a warning
# annotation and a job-summary line and stays green (scripts/ci/docker-org-mirror.mjs).
#
# The org repository's Docker Hub overview is set by hand: the only API that edits it is the
# legacy /v2/repositories endpoint, which rejects every Organization Access Token ("Forbidden"
# on every release while a peter-evans/dockerhub-description step ran here, hidden by
# continue-on-error).
#
# Second job, mirror-legacy-ghcr: the same copy into the legacy GHCR package
# ghcr.io/diegosouzapw/omniroute, which stopped on 2026-10-21 when the repository moved to the
# organization. Installs pinned to it keep getting releases until 2027-06-30 (owner decision,
# 2026-11-21); the index carries a "moved" description, which GHCR shows on the package page.
# It needs GHCR_LEGACY_TOKEN, a classic PAT of diegosouzapw with write:packages (the
# organization's GITHUB_TOKEN cannot write to a user's package); without it the job skips.

on:
  workflow_call:
    inputs:
      version:
        description: "Released version to mirror (e.g. 3.8.54)"
        required: true
        type: string
      promote_latest:
        description: "Also move :latest and :latest-web on the org repository"
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_ORG_USERNAME:
        required: false
      DOCKERHUB_ORG_TOKEN:
        required: false
      GHCR_LEGACY_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to mirror (e.g. 3.8.54)"
        required: true
        type: string
      promote_latest:
        description: "Also move :latest and :latest-web (only when this is the highest stable version)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mirror:
    name: Copy release to cheaperinference/omniroute
    runs-on: ${{ vars.DOCKER_AMD64_RUNNER == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 45
    # One group for every mirror run, whatever the caller: docker-publish groups by github.ref,
    # so two releases never share its group and their mirrors could otherwise overlap. Queued
    # here, the later run re-reads origin's tags (the script's :latest recheck) after the earlier
    # one finished, so an older release cannot move :latest back. GitHub keeps one pending run per
    # group: a pending mirror replaced by a newer one shows as cancelled and is re-run with a
    # workflow_dispatch of this workflow.
    concurrency:
      group: docker-org-mirror
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Copy the release images
        id: mirror
        env:
          VERSION: ${{ inputs.version }}
          PROMOTE_LATEST: ${{ inputs.promote_latest && 'true' || 'false' }}
          DOCKERHUB_ORG_USERNAME: ${{ secrets.DOCKERHUB_ORG_USERNAME }}
          DOCKERHUB_ORG_TOKEN: ${{ secrets.DOCKERHUB_ORG_TOKEN }}
        run: node scripts/ci/docker-org-mirror.mjs

  mirror-legacy-ghcr:
    name: Copy release to ghcr.io/diegosouzapw/omniroute (legacy, until 2027-06-30)
    runs-on: ${{ vars.DOCKER_AMD64_RUNNER == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 45
    # Its own group: the legacy copy never waits on, or cancels, the Docker Hub org copy.
    concurrency:
      group: docker-legacy-ghcr-mirror
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Copy the release images
        env:
          VERSION: ${{ inputs.version }}
          PROMOTE_LATEST: ${{ inputs.promote_latest && 'true' || 'false' }}
          TARGET_IMAGE: ghcr.io/diegosouzapw/omniroute
          MIRROR_USERNAME: diegosouzapw
          MIRROR_TOKEN: ${{ secrets.GHCR_LEGACY_TOKEN }}
          MIRROR_LABEL: Legacy GHCR mirror
          MIRROR_SECRET_HINT: the GHCR_LEGACY_TOKEN secret is
          MIRROR_UNTIL: "2027-06-30"
          INDEX_DESCRIPTION: "Moved to ghcr.io/cheaper-inference/omniroute (same images). This legacy package receives releases until 2027-06-30; switch your image name to keep updating after that."
        run: node scripts/ci/docker-org-mirror.mjs
