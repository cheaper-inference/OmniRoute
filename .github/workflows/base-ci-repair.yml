name: Release base repair
on:
  push:
    branches: [fix/release-v3.8.52-basereds]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "true"
      OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
      DISABLE_SQLITE_AUTO_BACKUP: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      OMNIROUTE_MAX_TEST_WORKERS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Verify old failure and final guarded transport
        run: node scripts/check/base-ci-repair.mjs
      - name: Clean owned state
        if: always()
        run: rm -rf -- .ci-work/base-ci-repair
