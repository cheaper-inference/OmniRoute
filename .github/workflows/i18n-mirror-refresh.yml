name: i18n mirror refresh

# Post-merge refresh of the translated docs mirrors (docs/i18n/<locale>/…). Since #18420 the
# docs drift gate is advisory on PRs and the merge train, so drifted mirrors pile up on the
# release branch until somebody runs `npm run i18n:run` by hand. This workflow does that run
# on a schedule and turns the result into ONE pull request:
#
#   1. target = the highest release/v* branch (or the `base` input); skipped with a notice while
#      an open `release-freeze` issue names that branch (Hard Rule #21);
#   2. drifted sources = `check-translation-drift.mjs --json --warn` (drifted, missing,
#      hand-edited and stale mirrors);
#   3. translate them: the LLM chain first when the backend secrets are configured (model, then
#      OMNIROUTE_TRANSLATION_FALLBACK_MODELS, then a re-split, then Google as the last resort),
#      otherwise the structure-safe Google engine alone. The docs/i18n/<locale>/llm.txt mirrors
#      are exact copies, not translations (run-translation and the drift check skip them):
#      when the root llm.txt moved, scripts/i18n/sync-llm-mirrors.mjs rewrites them in the
#      same run, since feature PRs edit only the root llm.txt;
#   4. `npm run check:docs-all` + the drift check must both pass; then the mirrors are committed
#      to the fixed branch `chore/i18n-mirror-refresh`, with a lease on its observed head;
#      one draft PR is opened, or a proven writer-owned PR is returned to draft and updated;
#   5. a partial translation (run-translation exit 3: some (source, locale) units failed, the
#      rest translated) still opens the PR with the translated mirrors. The failed units keep
#      their mirror and state record, the drift check excuses exactly those units, and the PR
#      body lists them for the next run (#18538);
#   6. a run where nothing translated, any other translation error, or any other check failure
#      opens NO PR and fails the job with a step summary that lists the failing files / locales.
#
# PRs opened with the default GITHUB_TOKEN do not trigger other workflows (no CI on the refresh
# PR). Set the `I18N_REFRESH_TOKEN` secret (fine-grained PAT or App token with contents +
# pull-requests write) so CI runs on it, the same pattern as FORWARD_PORT_TOKEN in
# forward-port.yml. With GITHUB_TOKEN the repo setting "Allow GitHub Actions to create and
# approve pull requests" must be on for `gh pr create` to work.
#
# Operator configuration (all optional; without the LLM ones the Google engine is used):
#   secrets.OMNIROUTE_TRANSLATION_API_KEY        LLM backend bearer token
#   secrets/vars.OMNIROUTE_TRANSLATION_API_URL   OpenAI-compatible base URL (…/v1)
#   vars.OMNIROUTE_TRANSLATION_MODEL             first model of the chain
#   vars.OMNIROUTE_TRANSLATION_FALLBACK_MODELS   comma-separated fallback chain
#   secrets.OMNIROUTE_TRANSLATION_GOOGLE_API_KEY official Cloud Translation v2 instead of the
#                                                keyless web endpoint
#   secrets.I18N_REFRESH_TOKEN                   token that opens the PR (see above)
#
# Secrets only ever reach the scripts through `env:`; no `${{ }}` expression is interpolated into
# a `run:` script.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Branch to refresh (default: the highest release/v* branch)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: i18n-mirror-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh drifted docs mirrors
    if: ${{ github.event_name != 'schedule' || github.repository == 'cheaper-inference/OmniRoute' }}
    runs-on: ${{ (vars.USE_VPS_RUNNER == 'true' && fromJSON('["self-hosted","omni-light"]')) || 'ubuntu-latest' }}
    timeout-minutes: 330
    permissions:
      contents: write # push chore/i18n-mirror-refresh
      pull-requests: write # open / retarget the refresh PR
      issues: read # complete release-freeze lookup
    env:
      REFRESH_BRANCH: chore/i18n-mirror-refresh
      PR_TITLE: "docs(i18n): refresh drifted mirrors (scheduled)"
    steps:
      - name: Resolve the target branch and the release freeze
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_BASE:-}" ]; then
            if ! printf '%s' "$INPUT_BASE" | grep -qE '^[A-Za-z0-9._/-]+$'; then
              echo "::error::refusing base input with unexpected characters" >&2
              exit 1
            fi
            BASE="$INPUT_BASE"
          else
            BASE=$(gh api --paginate "repos/$REPO/git/matching-refs/heads/release/v" --jq '.[].ref' \
              | sed 's#^refs/heads/##' | grep -E '^release/v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1)
          fi
          if [ -z "$BASE" ]; then
            echo "::error::could not resolve the target branch" >&2
            exit 1
          fi
          git check-ref-format "refs/heads/$BASE"
          BASE_SHA=$(timeout 120s gh api "repos/$REPO/git/ref/heads/$BASE" --jq '.object.sha')
          REFRESH_SHA=$(timeout 120s gh api "repos/$REPO/git/matching-refs/heads/$REFRESH_BRANCH" \
            --jq 'map(select(.ref == "refs/heads/chore/i18n-mirror-refresh")) | if length == 0 then "" elif length == 1 then .[0].object.sha else error("ambiguous refresh ref") end')
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::invalid base SHA"; exit 1; }
          [[ -z "$REFRESH_SHA" || "$REFRESH_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::invalid refresh SHA"; exit 1; }
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "refresh_sha=$REFRESH_SHA" >> "$GITHUB_OUTPUT"

          # Before checkout the repository helper is not available. Capture every page first;
          # a failed page/timeout must fail this step, never authorize an empty index.
          timeout 120s gh api --paginate --slurp \
            "repos/$REPO/issues?state=open&labels=release-freeze&per_page=100" \
            > "$RUNNER_TEMP/freeze-target.json"
          FROZEN=$(BASE="$BASE" FREEZE_JSON="$RUNNER_TEMP/freeze-target.json" node -e '
            const fs = require("node:fs");
            const filename = process.env.FREEZE_JSON;
            if (fs.statSync(filename).size > 64 * 1024 * 1024) throw Error("freeze index exceeds read limit");
            const pages = JSON.parse(fs.readFileSync(filename, "utf8"));
            if (!Array.isArray(pages) || !pages.every(Array.isArray)) throw Error("incomplete freeze pages");
            const issues = pages.flat();
            if (issues.length > 10000) throw Error("freeze index exceeds issue limit");
            const version = process.env.BASE.replace(/^release\//, "");
            const frozen = [];
            for (const issue of issues) {
              if (!issue || !Number.isSafeInteger(issue.number) || typeof issue.title !== "string") throw Error("invalid freeze issue");
              if (issue.pull_request) continue;
              const versions = issue.title.match(/v\d+\.\d+\.\d+/g) ?? [];
              if (!versions.length || versions.includes(version)) frozen.push("#" + issue.number);
            }
            process.stdout.write(frozen.join(", "));
          ')
          if [ -n "$FROZEN" ]; then
            echo "::notice::$BASE is under release-freeze ($FROZEN) — skipping the mirror refresh."
            echo "Skipped: \`$BASE\` is under release-freeze ($FROZEN)." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Target branch: \`$BASE\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout the target branch
        if: steps.target.outputs.skip == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Find the drifted sources
        id: drift
        if: steps.target.outputs.skip == 'false'
        env:
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
        run: |
          set -euo pipefail
          node scripts/i18n/mirror-refresh-safety.mjs head
          node scripts/i18n/check-translation-drift.mjs --json --warn > "$RUNNER_TEMP/drift-before.json"
          # every source with a drifted / missing / hand-edited / stale mirror, as repo-relative paths
          FILES=$(node scripts/i18n/mirror-refresh-safety.mjs sources "$RUNNER_TEMP/drift-before.json")
          # llm.txt mirrors are exact copies of the root llm.txt (not in the drift report):
          # count the ones the sync would rewrite, without writing.
          LLM_STALE=$(node --input-type=module -e '
            import { syncLlmMirrors } from "./scripts/i18n/sync-llm-mirrors.mjs";
            const r = await syncLlmMirrors({ dryRun: true });
            process.stdout.write(String(r.updated));
          ')
          if [ "$LLM_STALE" -gt 0 ]; then
            echo "llm=true" >> "$GITHUB_OUTPUT"
            echo "Stale llm.txt mirrors: $LLM_STALE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "llm=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$FILES" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
          else
            echo "Drifted sources: \`${FILES//,/\`, \`}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "files=$FILES" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$FILES" ] && [ "$LLM_STALE" -eq 0 ]; then
            echo "No drifted mirrors — nothing to refresh." >> "$GITHUB_STEP_SUMMARY"
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.drift.outputs.refresh == 'true'
        with:
          package-manager-cache: false
          node-version: "24"

      - uses: ./.github/actions/npm-ci-retry
        if: steps.drift.outputs.refresh == 'true'
        env:
          ONNXRUNTIME_NODE_INSTALL: "skip"

      - name: Translate the drifted mirrors
        id: translate
        if: steps.drift.outputs.files != ''
        env:
          FILES: ${{ steps.drift.outputs.files }}
          OMNIROUTE_TRANSLATION_API_KEY: ${{ secrets.OMNIROUTE_TRANSLATION_API_KEY }}
          OMNIROUTE_TRANSLATION_API_URL: ${{ secrets.OMNIROUTE_TRANSLATION_API_URL || vars.OMNIROUTE_TRANSLATION_API_URL }}
          OMNIROUTE_TRANSLATION_MODEL: ${{ vars.OMNIROUTE_TRANSLATION_MODEL }}
          OMNIROUTE_TRANSLATION_FALLBACK_MODELS: ${{ vars.OMNIROUTE_TRANSLATION_FALLBACK_MODELS }}
          OMNIROUTE_TRANSLATION_GOOGLE_API_KEY: ${{ secrets.OMNIROUTE_TRANSLATION_GOOGLE_API_KEY }}
        run: |
          set -uo pipefail
          if [ -n "$OMNIROUTE_TRANSLATION_API_KEY" ] && [ -n "$OMNIROUTE_TRANSLATION_API_URL" ] \
            && [ -n "$OMNIROUTE_TRANSLATION_MODEL" ]; then
            ENGINE=llm
          else
            ENGINE=google
            if [ -n "$OMNIROUTE_TRANSLATION_API_KEY" ] || [ -n "$OMNIROUTE_TRANSLATION_API_URL" ]; then
              echo "::warning::LLM backend partially configured (API key, API URL and vars.OMNIROUTE_TRANSLATION_MODEL are all required) — using Google."
            fi
          fi
          export OMNIROUTE_TRANSLATION_ENGINE="$ENGINE"
          export OMNIROUTE_TRANSLATION_GOOGLE_FALLBACK=1
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"
          echo "Engine: \`$ENGINE\`" >> "$GITHUB_STEP_SUMMARY"
          # The default `bash -e` would end the step on a non-zero pipeline before RC is read, so
          # catch the status here (pipefail makes it the translator's exit code).
          RC=0
          node scripts/i18n/run-translation.mjs --files="$FILES" \
            --failures-json="$RUNNER_TEMP/translate-failures.json" 2>&1 \
            | tee "$RUNNER_TEMP/translate.log" || RC=$?
          if [ "$RC" -eq 3 ]; then
            # Partial: the translated units are written and recorded, the failed ones are untouched.
            echo "partial=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Partial translation (exit 3): failed locales left as they were"
              echo
              echo '```'
              grep -E '^  - .+ \[[^]]+\]: ' "$RUNNER_TEMP/translate.log" | head -100 || true
              grep -E 'summary: translated=' "$RUNNER_TEMP/translate.log" | tail -1 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RC" -ne 0 ]; then
            {
              echo "### Translation failed (exit $RC) — no PR opened"
              echo
              echo '```'
              grep -E '^  - .+ \[[^]]+\]: ' "$RUNNER_TEMP/translate.log" | head -100 || true
              grep -E 'summary: translated=' "$RUNNER_TEMP/translate.log" | tail -1 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$RC"
          fi

      - name: Sync the llm.txt mirrors
        if: steps.drift.outputs.llm == 'true'
        run: node scripts/i18n/sync-llm-mirrors.mjs

      - name: Check the refreshed mirrors
        if: steps.drift.outputs.refresh == 'true'
        env:
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          PARTIAL: ${{ steps.translate.outputs.partial }}
        run: |
          set -uo pipefail
          FAILED=0
          # Derived files are refreshed at release (plan 2026-11-13): sources only, base drift excused.
          OMNIROUTE_GATE_MODE="pr" npm run check:docs-all 2>&1 | tee "$RUNNER_TEMP/docs-all.log"
          DOCS_RC=${PIPESTATUS[0]}
          if ! node scripts/i18n/check-translation-drift.mjs --json --warn > "$RUNNER_TEMP/drift-after.json"; then
            echo "::error::could not produce the drift report"
            exit 1
          fi
          # The partial exception requires both original mirror bytes and locale records.
          if ! node scripts/i18n/mirror-refresh-safety.mjs check "$RUNNER_TEMP/drift-after.json"; then
            FAILED=1
            echo "### Mirror drift or failed-unit preimage check failed — no PR opened" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$DOCS_RC" -ne 0 ]; then
            FAILED=1
            {
              echo "### \`npm run check:docs-all\` failed (exit $DOCS_RC) — no PR opened"
              echo
              echo '```'
              grep -E 'docs/i18n/|FAIL|✗|✖|ERROR' "$RUNNER_TEMP/docs-all.log" | head -100 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$FAILED"

      - name: Commit and open or update the refresh PR
        if: steps.drift.outputs.refresh == 'true'
        env:
          GH_TOKEN: ${{ secrets.I18N_REFRESH_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ steps.target.outputs.base }}
          BASE_SHA: ${{ steps.target.outputs.base_sha }}
          REFRESH_SHA: ${{ steps.target.outputs.refresh_sha }}
          ENGINE: ${{ steps.translate.outputs.engine }}
          PARTIAL: ${{ steps.translate.outputs.partial }}
          FILES: ${{ steps.drift.outputs.files }}
          LLM: ${{ steps.drift.outputs.llm }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/i18n/mirror-refresh-safety.mjs head
          git add -A docs/i18n .i18n-state.json
          node scripts/i18n/mirror-refresh-safety.mjs index
          if git diff --cached --quiet; then
            echo "Translation produced no change — nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Retain this fingerprint in the parent shell so a hook cannot rewrite the
          # failed-unit exception after the original checks.
          TRANSLATION_SHA=$(node scripts/i18n/mirror-refresh-safety.mjs summary-sha)
          export TRANSLATION_SHA
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "$PR_TITLE" -m "Run: ${RUN_URL}"
          CANDIDATE_SHA=$(git rev-parse HEAD)
          export CANDIDATE_SHA
          node scripts/i18n/mirror-refresh-safety.mjs candidate

          # Hooks may format mirrors or update their state. Certify the committed tree,
          # preserving the post-merge writer's pr/derived policy and partial exception.
          OMNIROUTE_GATE_MODE="pr" npm run check:docs-all 2>&1 | tee "$RUNNER_TEMP/docs-after-commit.log"
          node scripts/i18n/check-translation-drift.mjs --json --warn > "$RUNNER_TEMP/drift-after-commit.json"
          node scripts/i18n/mirror-refresh-safety.mjs check "$RUNNER_TEMP/drift-after-commit.json"
          node scripts/i18n/mirror-refresh-safety.mjs candidate

          gh auth setup-git
          node scripts/i18n/mirror-refresh-safety.mjs remote
          timeout 120s gh api --paginate --slurp \
            "repos/$REPO/issues?state=open&labels=release-freeze&per_page=100" \
            > "$RUNNER_TEMP/freeze-publish.json"
          node scripts/i18n/mirror-refresh-safety.mjs freeze "$RUNNER_TEMP/freeze-publish.json" "$BASE"
          # An existing branch needs one open same-repository PR, the writer marker,
          # and a last-published candidate that still matches the observed remote head.
          timeout 120s gh pr list --repo "$REPO" --head "$REFRESH_BRANCH" --state open --limit 101 \
            --json number,state,isDraft,baseRefName,headRefName,headRefOid,headRepository,isCrossRepository,body \
            > "$RUNNER_TEMP/refresh-prs.json"
          PR_INFO=$(node scripts/i18n/mirror-refresh-safety.mjs owner "$RUNNER_TEMP/refresh-prs.json")
          IFS=$'\t' read -r NUM WAS_DRAFT OLD_BASE <<< "$PR_INFO"
          node scripts/i18n/mirror-refresh-safety.mjs body > "$RUNNER_TEMP/pr-body.md"
          if [ "$NUM" != "0" ] && [ "$WAS_DRAFT" != "true" ]; then
            gh pr ready "$NUM" --repo "$REPO" --undo
            gh pr view "$NUM" --repo "$REPO" \
              --json number,state,isDraft,baseRefName,headRefName,headRefOid,headRepository,isCrossRepository,body \
              > "$RUNNER_TEMP/draft-pr.json"
            node scripts/i18n/mirror-refresh-safety.mjs draft "$RUNNER_TEMP/draft-pr.json"
          fi

          # Recheck immediately before publishing; the lease also rejects a competing
          # push after these reads, including creation of an initially absent branch.
          if [ "$NUM" != "0" ]; then
            gh pr view "$NUM" --repo "$REPO" \
              --json number,state,isDraft,baseRefName,headRefName,headRefOid,headRepository,isCrossRepository,body \
              > "$RUNNER_TEMP/draft-pr-final.json"
            node scripts/i18n/mirror-refresh-safety.mjs draft "$RUNNER_TEMP/draft-pr-final.json"
          fi
          node scripts/i18n/mirror-refresh-safety.mjs remote
          timeout 120s gh api --paginate --slurp \
            "repos/$REPO/issues?state=open&labels=release-freeze&per_page=100" \
            > "$RUNNER_TEMP/freeze-publish-final.json"
          node scripts/i18n/mirror-refresh-safety.mjs freeze "$RUNNER_TEMP/freeze-publish-final.json" "$BASE"
          node scripts/i18n/mirror-refresh-safety.mjs candidate
          git push --quiet "--force-with-lease=refs/heads/${REFRESH_BRANCH}:${REFRESH_SHA}" \
            origin "${CANDIDATE_SHA}:refs/heads/${REFRESH_BRANCH}"

          if [ "$NUM" = "0" ]; then
            URL=$(gh pr create --repo "$REPO" --base "$BASE" --head "$REFRESH_BRANCH" --draft \
              --title "$PR_TITLE" --body-file "$RUNNER_TEMP/pr-body.md")
            echo "Opened draft $URL" >> "$GITHUB_STEP_SUMMARY"
          else
            # Persist the receipt in the body: future runs must compare this candidate
            # with the remote head before replacing any work on the fixed branch.
            gh pr edit "$NUM" --repo "$REPO" --base "$BASE" --body-file "$RUNNER_TEMP/pr-body.md"
            gh pr view "$NUM" --repo "$REPO" \
              --json number,state,isDraft,baseRefName,headRefName,headRefOid,headRepository,isCrossRepository,body \
              > "$RUNNER_TEMP/published-pr.json"
            node scripts/i18n/mirror-refresh-safety.mjs published "$RUNNER_TEMP/published-pr.json"
            echo "Updated draft #$NUM at $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
