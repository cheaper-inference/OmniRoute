          echo "✅ Published omniroute@$VERSION (dist-tag=$TAG) [DIRECT mode]"

  publish-opencode-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          # Full history needed for auto-bump: git diff against the commit npm last published
          # the plugin from (its gitHead), or the previous release tag

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NPM_PUBLISH_NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Auto-bump plugin version if plugin changed since last release
        id: bump
        working-directory: "@omniroute/opencode-plugin"
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")

          # Exit 0 when npm has ${PKG_NAME}@$1, 1 when it definitely does not (no output, or
          # npm's E404). Any other answer is a registry failure: it fails the step instead of
          # reading as "not published" (the `npm view ... || true` it replaces did).
          npm_has_version() {
            local out err rc=0
            err=$(mktemp)
            out=$(npm view "${PKG_NAME}@$1" version 2>"$err") || rc=$?
            if [ "$rc" -eq 0 ] && [ "$out" = "$1" ]; then rm -f "$err"; return 0; fi
            if [ "$rc" -eq 0 ] && [ -z "$out" ]; then rm -f "$err"; return 1; fi
            if [ "$rc" -ne 0 ] && grep -q 'code E404' "$err"; then rm -f "$err"; return 1; fi
            echo "::error::npm view ${PKG_NAME}@$1 was inconclusive (exit $rc): ${out}" >&2
            cat "$err" >&2
            exit 1
          }

          # 1) Skip if current version is not yet published (no bump needed)
          if ! npm_has_version "$PKG_VERSION"; then
            echo "✅ ${PKG_NAME}@${PKG_VERSION} is new — no bump needed."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2) Baseline: the commit npm recorded (gitHead) for the version its "latest" tag
          # serves. The previous release tag alone missed a change from a release whose plugin
          # publish failed or never ran: the next release already had it at its previous tag,
          # saw no diff, and the change never reached npm. git diff compares trees, so the
          # commit only has to be in this full-history checkout (fetch-depth: 0), not be an
          # ancestor of the release. Without a usable gitHead the previous release tag is the
          # baseline, as before; a registry failure fails the step, like npm_has_version.
          HEAD_ERR=$(mktemp)
          HEAD_RC=0
          PUBLISHED_HEAD=$(npm view "${PKG_NAME}@latest" gitHead 2>"$HEAD_ERR") || HEAD_RC=$?
          if [ "$HEAD_RC" -ne 0 ]; then
            echo "::error::npm view ${PKG_NAME}@latest gitHead failed (exit $HEAD_RC)." >&2
            cat "$HEAD_ERR" >&2
            exit 1
          fi
          rm -f "$HEAD_ERR"
          BASE=""
          if [ -z "$PUBLISHED_HEAD" ]; then
            echo "::warning::npm has no gitHead for ${PKG_NAME}@latest — comparing with the previous release tag."
          elif [[ ! "$PUBLISHED_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::npm's gitHead for ${PKG_NAME}@latest is not a commit id — comparing with the previous release tag."
          elif ! git cat-file -e "${PUBLISHED_HEAD}^{commit}" 2>/dev/null; then
            echo "::warning::${PKG_NAME}@latest was published from ${PUBLISHED_HEAD}, which this checkout does not have — comparing with the previous release tag."
          else
            BASE="$PUBLISHED_HEAD"
            echo "Baseline: ${PKG_NAME}@latest was published from ${BASE}."
          fi
          if [ -z "$BASE" ]; then
            # Previous release tag (exclude the current one)
            BASE=$(git tag -l 'v*' --sort=-version:refname \
              | grep -v "^${CURRENT_TAG}$" | head -1 || echo "")
            if [ -z "$BASE" ]; then
              echo "No previous tag to compare — skipping bump."
              echo "bumped=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # 3) Check if plugin dir actually changed since that baseline. The step runs inside
          # the plugin folder and git resolves pathspecs against the current directory, so the
          # folder is "." here (the repo-root path matched nothing and no change was ever seen).
          if git diff --quiet "$BASE" -- .; then
            echo "⏭️ No plugin changes since $BASE — nothing to publish."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 4) Auto-bump the patch version past every version npm already has. The bump only
          # exists in this job's workspace (the committed manifest keeps the old version), so a
          # later release with plugin changes starts from the same manifest: a single bump
          # recomputed a version an earlier release had published, and the publish step below
          # skipped it without publishing the change.
          # Every candidate is looked up before it can be selected; 50 taken candidates fail.
          NEW_VERSION=""
          for _ in $(seq 1 50); do
            npm version patch --no-git-tag-version --allow-same-version
            CANDIDATE=$(node -p "require('./package.json').version")
            if ! npm_has_version "$CANDIDATE"; then
              NEW_VERSION="$CANDIDATE"
              break
            fi
            echo "${PKG_NAME}@${CANDIDATE} is already on npm — bumping again."
          done
          if [ -z "$NEW_VERSION" ]; then
            echo "::error::${PKG_NAME}: no unpublished patch version within 50 bumps of ${PKG_VERSION}."
            exit 1
          fi
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "📦 Auto-bumped ${PKG_NAME} from ${PKG_VERSION} to ${NEW_VERSION}"

      - name: Install plugin dependencies
        working-directory: "@omniroute/opencode-plugin"
        run: npm install --no-audit --no-fund

      - name: Build plugin
        working-directory: "@omniroute/opencode-plugin"
        run: npm run clean && npm run build

      - name: Test plugin
        working-directory: "@omniroute/opencode-plugin"
        run: npm test

      # Trusted Publishing (OIDC), like the main package: no NODE_AUTH_TOKEN. npm >= 11.5
      # detects the job's id-token itself. The Trusted Publisher of this package
      # (cheaper-inference/OmniRoute, npm-publish.yml, no environment, "npm publish" allowed)
      # was set up on 2026-11-18, after the long-lived NPM_TOKEN expired and v3.8.54's
      # plugin publishes answered E404.
      - name: Publish @omniroute/opencode-plugin to npm
        working-directory: "@omniroute/opencode-plugin"
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          # Same hardened skip-check as the main job (no --silent flag).
          PUBLISHED="$(npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null || true)"
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "⚠️ ${PKG_NAME}@${PKG_VERSION} is already published on npm — skipping."
            exit 0
          fi
          npm publish --provenance --access public --ignore-scripts
          echo "✅ Published ${PKG_NAME}@${PKG_VERSION}"

