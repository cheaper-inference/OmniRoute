name: Publish to Docker Hub

on:
  push:
    branches:
      - main
      - "release/v*"
    tags:
      - "v*"
    paths-ignore:
      - ".github/workflows/**"
  # Use 'released' instead of 'published' so editing/re-publishing old releases
  # does NOT re-trigger this workflow. 'released' fires only on the initial
  # release publication (and pre-release → release transition).
  release:
    types: [released]
  # #14560: nightly re-run exists only to drive the omni-build runner alert below
  # (open/close the tracking issue). Publish jobs skip themselves on this event.
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. 3.8.4)"
        required: true
        type: string
      promote_latest:
        description: "Also tag :latest (only if this is the highest semver)"
        required: false
        type: boolean
        default: false

# One publish per ref. A merge storm used to fan out 8 concurrent hosted builds,
# every one OOM-killing `npm run build` inside BuildKit (#11976). The :next
# channel only needs the newest SHA; cancel-in-progress is the same pattern as
# quality.yml / nightly-release-green.
# The nightly `schedule` run (runner-alert only) gets its own group: it runs on the
# default branch ref, so sharing the publish group would let cancel-in-progress kill
# an in-flight release-branch publish every night (#14560 follow-up).
# A push to release/v* must NOT cancel the build already running for that branch (#17230):
# the amd64 image takes ~2 h on the single omni-build runner and the branch merges faster than
# that, so with cancel-in-progress the next/next-web channel went 13 days without an image
# (24 cancelled publishes on 2026-10-19 alone). Without it GitHub still keeps at most one
# running and one pending run per group — an older pending run is replaced by the newest push,
# the in-flight build completes, the latest tip follows. Tags, releases, dispatches and the
# scheduled alert keep cancelling.
concurrency:
  group: docker-publish-${{ github.event_name == 'schedule' && 'runner-alert' || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) }}

# Least-privilege default: read-only at the top level; the build and merge jobs that
# push to GHCR grant packages: write themselves (Scorecard TokenPermissions).
permissions:
  contents: read

jobs:
  prepare:
    name: Resolve Docker release metadata
    permissions:
      contents: read
      packages: read
      # Read this month's docker-publish jobs for the Blacksmith budget step.
      actions: read
    # Keep the explicit upstream scheduled-run guard on every job, including
    # publish jobs that currently exclude schedule entirely.
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'schedule' || github.repository == 'cheaper-inference/OmniRoute')
    # With DOCKER_AMD64_RUNNER=blacksmith the small jobs around the build run on Blacksmith as
    # well: on 2026-11-03 this job waited 3 h for a hosted ubuntu-latest slot behind ~300 queued
    # PR runs. About 2.5 min here plus 4.5 min in `merge` per publish, on 2 vCPU.
    runs-on: ${{ vars.DOCKER_AMD64_RUNNER == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      promote_latest: ${{ steps.version.outputs.promote_latest }}
      skip: ${{ steps.version.outputs.skip }}
      # 'true' while DOCKER_AMD64_RUNNER=blacksmith and the month's Blacksmith minutes are
      # under BLACKSMITH_MONTHLY_MINUTES_CAP; `build` and `merge` route on it.
      blacksmith: ${{ steps.budget.outputs.blacksmith }}
    env:
      IMAGE_NAME: diegosouzapw/omniroute
      GHCR_IMAGE_NAME: ghcr.io/cheaper-inference/omniroute
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Control scripts come from this workflow ref, not an older release tag.
          # The build job below still checks out the requested version's source.
          # Shallow: the :latest decision reads tag NAMES from `git ls-remote` below, so the
          # 2.6 GB history is not needed. A full clone took 30+ min on a Blacksmith runner
          # (outside GitHub's network) on 2026-11-03.
          fetch-depth: 1

      # Blacksmith keeps running and invoices past its free 3,000 minutes, and a publish costs
      # ~90 of them, so the month's usage is summed here and the build falls back to the hosted
      # runner at the cap (default 2,500, leaving room for the jobs already in flight).
      - name: Stay within the Blacksmith monthly minutes
        id: budget
        env:
          WANT: ${{ vars.DOCKER_AMD64_RUNNER }}
          CAP: ${{ vars.BLACKSMITH_MONTHLY_MINUTES_CAP || '2500' }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: node scripts/ci/blacksmith-budget.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version, latest-promotion, and skip flag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_VERSION: ${{ inputs.version }}
          PROMOTE_INPUT: ${{ inputs.promote_latest }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # 1) Resolve version/channel from the trigger. Only the current default
          # release branch publishes the mutable `next` channel; main keeps `main`.
          VERSION=$(bash scripts/ci/resolve-docker-publish-version.sh \
            "$EVENT_NAME" "$REF_TYPE" "$REF_NAME" "$INPUT_VERSION" "$DEFAULT_BRANCH")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Frozen release branches keep receiving coordination commits after the
          # next cycle becomes the default branch. They must not overwrite :next,
          # but that expected no-op is not a workflow failure.
          if [ "$VERSION" = "skip" ]; then
            echo "promote_latest=false" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping Docker publish from non-default release branch: $REF_NAME"
            exit 0
          fi

          # 2) Decide whether to promote :latest. Floating channels are never
          # eligible, and the helper independently fails closed for non-semver.
          PROMOTE="false"
          if [ "$VERSION" = "main" ] || [ "$VERSION" = "next" ]; then
            PROMOTE="false"
          elif printf '%s' "$VERSION" | grep -qE -- '-(rc|alpha|beta|pre|next)'; then
            echo "Pre-release identifier detected — skipping :latest."
            PROMOTE="false"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PROMOTE="${PROMOTE_INPUT:-false}"
          else
            # Decide via the extracted helper, which folds VERSION into the
            # candidate set so the result is independent of git-tag sync timing
            # on `release` events (#5301). Without that, the freshly-created tag
            # is often not yet visible here and :latest stays a release behind.
            # Tag names come straight from the remote (same set `git fetch --tags`
            # gave the full clone); under pipefail a failed listing fails the step
            # instead of promoting against an empty list.
            PROMOTE=$(git ls-remote --tags --refs origin \
              | sed -n 's#^[0-9a-f]*[[:space:]]refs/tags/\(v[0-9].*\)$#\1#p' \
              | bash scripts/ci/should-promote-latest.sh "$VERSION")
            if [ "$PROMOTE" != "true" ]; then
              echo "Version $VERSION is not the highest stable semver. Not promoting :latest."
            fi
          fi
          echo "promote_latest=$PROMOTE" >> "$GITHUB_OUTPUT"

          # 3) Skip only when the mandatory Node and Web images are complete in BOTH
          # registries: an existing Node base must not block repairing a missing Web
          # image or architecture. Bun is deliberately not part of this check. It is
          # best-effort, so a release with a failing Bun leg, or a historical version
          # without Bun tags, must not rebuild (~2 h) on every trigger. workflow_dispatch
          # never skips: it is the explicit repair path, Bun tags and stale aliases included.
          # Helper exit codes: 1 = missing or incomplete (publish), 2 = could not tell.
          SKIP="false"
          if [ "$VERSION" != "main" ] && [ "$VERSION" != "next" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            SKIP="true"
            for ref in \
              "${IMAGE_NAME}:${VERSION}" "${IMAGE_NAME}:${VERSION}-web" \
              "${GHCR_IMAGE_NAME}:${VERSION}" "${GHCR_IMAGE_NAME}:${VERSION}-web"; do
              rc=0
              node scripts/ci/docker-image-complete.mjs "$ref" || rc=$?
              if [ "$rc" -eq 1 ]; then
                echo "$ref is missing or incomplete — publishing."
                SKIP="false"
                break
              fi
              if [ "$rc" -ne 0 ]; then
                echo "::error::Could not inspect $ref (registry error, not a missing tag). Not starting a rebuild on an unknown state: re-run this job once the registry recovers, or use workflow_dispatch to force a publish."
                exit 1
              fi
            done
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

          echo "Publishing diegosouzapw/omniroute:$VERSION (promote_latest=$PROMOTE, skip=$SKIP)"

  # #14560: when USE_VPS_RUNNER is on, the amd64 leg can ONLY run on the single
  # `omni-build` self-hosted listener. If that box is offline, GitHub queues the
  # job forever — no error, no timeout (timeout-minutes only starts once a
  # runner picks the job up, so it cannot bound queue time) — and the publish
  # silently stalls until a human cancels the run. This preflight turns that
  # silent queue into a red run within minutes, with the verdict in the job name.
  runner-preflight:
    name: Preflight — amd64 runner availability
    needs: prepare
    if: >-
      github.event_name != 'schedule' && needs.prepare.outputs.skip != 'true' && vars.USE_VPS_RUNNER == 'true' && vars.USE_VPS_BUILD_RUNNER == 'true' &&
      vars.DOCKER_AMD64_RUNNER != 'blacksmith' && vars.DOCKER_AMD64_RUNNER != 'hosted' &&
      (github.event_name != 'schedule' || github.repository == 'cheaper-inference/OmniRoute')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check an online runner carries the omni-build label
        env:
          # Listing self-hosted runners needs the repository "Administration: read"
          # permission, which GITHUB_TOKEN can never be granted through `permissions:`.
          # RUNNER_STATUS_TOKEN (optional secret: fine-grained PAT with Administration
          # read on this repo, or a classic PAT with `repo`) activates the check;
          # without it the API answers 403 and the preflight fails OPEN with a
          # warning, so a missing/under-scoped token can never block a publish.
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if ! ONLINE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" \
            --paginate --jq '[.runners[] | select(.status == "online") | select(any(.labels[]; .name == "omni-build"))] | length'); then
            echo "::warning::Could not list self-hosted runners (token lacks Administration read — set the RUNNER_STATUS_TOKEN secret). Skipping the omni-build availability check."
            exit 0
          fi
          echo "online omni-build runners: ${ONLINE}"
          if [ "${ONLINE}" -eq 0 ]; then
            echo "::error::No ONLINE runner carries the omni-build label. The amd64 build would queue forever (silent publish stall, #14560)."
            echo "Check the self-hosted runner pool, or set DOCKER_AMD64_RUNNER=hosted (or blacksmith) to build amd64 off the .113 slot."
            exit 1
          fi

  build:
    name: Build Docker (${{ matrix.platform }})
    needs: [prepare, runner-preflight]
    # runner-preflight is SKIPPED when USE_VPS_RUNNER is off; a plain `if:` would
    # inherit the implicit success() check and skip the whole build with it.
    if: >-
      !cancelled() && github.event_name != 'schedule' &&
      needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' &&
      (needs.runner-preflight.result == 'success' || needs.runner-preflight.result == 'skipped') &&
      (github.event_name != 'schedule' || github.repository == 'cheaper-inference/OmniRoute')
    # amd64: the .113 omni-build pool (31 GB / 32 cores, ONE listener since
    # #12048). Hosted ubuntu-24.04 is 16 GB; the ~7 GB runners of #11976 died
    # ResourceExhausted. Falls back to hosted when USE_VPS_RUNNER is off. arm64: no ARM box — stay
    # on GitHub's ubuntu-24.04-arm.
    # Webpack on BOTH arches: Turbopack on omniroute-113-6 hit
    # TurbopackInternalError "there must be a path to a root" after 26 min
    # (run 33253576569). The same tree's arm64 webpack build on hosted ARM
    # succeeded (run 33264823398). Dockerfile already documents webpack as the
    # Docker escape hatch (OMNIROUTE_USE_TURBOPACK=0).
    # DOCKER_AMD64_RUNNER (repository variable) moves the amd64 leg off the .113 slot, which takes
    # 90-165 min per publish while the same build on a 16 GB / 4 vCPU hosted runner takes 20-45:
    #   blacksmith → blacksmith-4vcpu-ubuntu-2404 (16 GB; needs the Blacksmith app on the org; the
    #                free tier is 3,000 2-vCPU minutes a month and a 4 vCPU minute counts as two)
    #   hosted     → ubuntu-24.04 (16 GB)
    #   unset      → unchanged: omni-build when the .113 opt-in is on, hosted otherwise
    # The Dockerfile build is sized for 16 GB (OMNIROUTE_BUILD_WORKERS, #7518).
    # `blacksmith` routes through prepare's budget output; at the monthly cap it lands on hosted.
    runs-on: ${{ matrix.arch == 'amd64' && (needs.prepare.outputs.blacksmith == 'true' && 'blacksmith-4vcpu-ubuntu-2404' || vars.DOCKER_AMD64_RUNNER != 'hosted' && vars.DOCKER_AMD64_RUNNER != 'blacksmith' && vars.USE_VPS_RUNNER == 'true' && vars.USE_VPS_BUILD_RUNNER == 'true' && fromJSON('["self-hosted","omni-build"]') || 'ubuntu-24.04') || 'ubuntu-24.04-arm' }}
    # Share the 1-slot omni-build ceiling (#12048) with ci.yml `Build` /
    # npm-publish. Same group as main's Build so a :next publish waits beside
    # the artefact instead of sitting next to it. arm64 is hosted — its own
    # group, cancelled by the workflow-level concurrency. An amd64 leg moved by
    # DOCKER_AMD64_RUNNER does not hold the slot, so it gets a per-ref group.
    concurrency:
      group: ${{ matrix.arch == 'amd64' && (vars.DOCKER_AMD64_RUNNER != 'blacksmith' && vars.DOCKER_AMD64_RUNNER != 'hosted' && 'heavy-build-main' || format('docker-publish-amd64-{0}', github.ref)) || format('docker-publish-arm-{0}', github.ref) }}
      cancel-in-progress: ${{ matrix.arch != 'amd64' }}
    # Backstop for a hung BUILD step only — it cannot and must not bound the
    # queue wait (that is runner-preflight's job): the clock starts when a
    # runner accepts the job. 350 min = the ~2h50m observed webpack build plus
    # headroom, so a wedged Docker/BuildKit step fails loudly instead of
    # holding the single omni-build slot until someone notices.
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    env:
      IMAGE_NAME: diegosouzapw/omniroute
      GHCR_IMAGE_NAME: ghcr.io/cheaper-inference/omniroute
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || '' }}
          # .dockerignore drops .git, so the image build never reads history.
          fetch-depth: 1

      - name: Assert Docker Engine
        run: docker info

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Heap for the webpack build inside BuildKit: 12288 MB on every build-args block below.
      # Validated on the hosted runners (16 GB) by the publishes of 2026-10-16/17 — runs
      # 38904652365, 38907575198 and 39010473398, amd64 and arm64 green (27-55 min). It stays
      # at or above build.yml's native webpack floor (10240 MB), never below it
      # (tests/unit/docker-publish-build-heap-14325.test.ts).
      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: ${{ matrix.platform }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: |
            ${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE_NAME }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max,ignore-error=true
          no-cache: false
        env:
          DOCKER_BUILDKIT_INLINE_CACHE: 1

      - name: Build and push WEB platform image by digest
        id: build-web
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-web
          platforms: ${{ matrix.platform }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: |
            ${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE_NAME }}
          # runner-web extends runner-base: reuse this run's base build as well
          # as the previous Web cache, without mixing Node/Bun or architectures.
          cache-from: |
            type=gha,scope=docker-web-${{ matrix.arch }}
            type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-web-${{ matrix.arch }},mode=max,ignore-error=true
          no-cache: false
        env:
          DOCKER_BUILDKIT_INLINE_CACHE: 1

      # Check the binaries in both final Node images on each native architecture,
      # before their digests can reach the multi-arch manifest/promotion job.
      - name: Verify published Node runtimes
        env:
          DIGEST_BASE: ${{ steps.build.outputs.digest }}
          DIGEST_WEB: ${{ steps.build-web.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          for digest in "$DIGEST_BASE" "$DIGEST_WEB"; do
            image="${GHCR_IMAGE_NAME}@${digest}"
            echo "Verifying Node runtime in ${image} (${PLATFORM})"
            docker run --rm --pull always --platform "$PLATFORM" --entrypoint node -i \
              "$image" --input-type=module < scripts/ci/check-docker-node-runtime.mjs
          done

      # The mandatory digests leave this job BEFORE any Bun step starts, so nothing Bun
      # does can stop them from being exported and uploaded (#11724, #11740, #17223).
      - name: Export digests
        env:
          DIGEST_BASE: ${{ steps.build.outputs.digest }}
          DIGEST_WEB: ${{ steps.build-web.outputs.digest }}
        run: |
          set -euo pipefail
          # Self-hosted runners keep /tmp across runs: start empty so digests of
          # earlier runs are never uploaded (#15184).
          rm -rf /tmp/digests
          mkdir -p /tmp/digests/base /tmp/digests/web
          touch "/tmp/digests/base/${DIGEST_BASE#sha256:}"
          touch "/tmp/digests/web/${DIGEST_WEB#sha256:}"

      - name: Upload base digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-base-${{ matrix.arch }}
          path: /tmp/digests/base/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload web digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-web-${{ matrix.arch }}
          path: /tmp/digests/web/*
          if-no-files-found: error
          retention-days: 1

      - name: Build and push BUN base platform image by digest
        id: build-bun-base
        # Bun is a best-effort compatibility target, not a supported runtime
        # (AGENTS.md -> Environment). Its `bun run build` has been OOM-killing on
        # both arches; letting that sink the whole publish means the SUPPORTED
        # runner-base / runner-web images never reach the registry either. The
        # merge job publishes a Bun tag only when both architectures produced a
        # valid digest, so a failure here costs that tag and nothing else.
        continue-on-error: true
        # A step limit, because reaching the job's 350 min limit fails the job and the
        # merge job then publishes nothing. Observed amd64 Bun base: 57 min (2026-11-02).
        timeout-minutes: 80
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.bun
          target: runner-base
          platforms: ${{ matrix.platform }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: |
            ${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE_NAME }}
          cache-from: type=gha,scope=docker-bun-base-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-bun-base-${{ matrix.arch }},mode=max,ignore-error=true
          no-cache: false
        env:
          DOCKER_BUILDKIT_INLINE_CACHE: 1

      - name: Build and push BUN web platform image by digest
        id: build-bun-web
        # Best-effort, same as the Bun base step above.
        continue-on-error: true
        timeout-minutes: 80
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.bun
          target: runner-web
          platforms: ${{ matrix.platform }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: |
            ${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE_NAME }}
          cache-from: |
            type=gha,scope=docker-bun-web-${{ matrix.arch }}
            type=gha,scope=docker-bun-base-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-bun-web-${{ matrix.arch }},mode=max,ignore-error=true
          no-cache: false
        env:
          DOCKER_BUILDKIT_INLINE_CACHE: 1

      - name: Export Bun digests
        continue-on-error: true
        env:
          DIGEST_BUN_BASE: ${{ steps.build-bun-base.outputs.digest }}
          DIGEST_BUN_WEB: ${{ steps.build-bun-web.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests/bun-base /tmp/digests/bun-web
          # Empty when the (non-blocking) bun build produced no image. `if` blocks,
          # not `[ -n ] && touch`: under `set -e` a failing AND-list aborts the step,
          # which is precisely the case being handled here.
          if [ -n "$DIGEST_BUN_BASE" ]; then
            touch "/tmp/digests/bun-base/${DIGEST_BUN_BASE#sha256:}"
          else
            echo "::warning::Bun base build produced no digest on this architecture: no -bun tag this run."
          fi
          if [ -n "$DIGEST_BUN_WEB" ]; then
            touch "/tmp/digests/bun-web/${DIGEST_BUN_WEB#sha256:}"
          else
            echo "::warning::Bun web build produced no digest on this architecture: no -web-bun tag this run."
          fi

      - name: Upload bun-base digests
        # continue-on-error: a failed upload would otherwise fail the job and the merge
        # job would then skip the mandatory images too. `ignore`, not `error`: an absent
        # digest is the expected outcome of a failed bun image.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-bun-base-${{ matrix.arch }}
          path: /tmp/digests/bun-base/*
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload bun-web digests
        # Same as the bun-base upload above.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-bun-web-${{ matrix.arch }}
          path: /tmp/digests/bun-web/*
          if-no-files-found: ignore
          retention-days: 1

  merge:
    name: Publish multi-arch manifests
    needs:
      - prepare
      - build
    # Explicit results, like `build`: an implicit success() also looks at `build`'s own
    # dependency runner-preflight, which is SKIPPED whenever amd64 is off the omni-build slot
    # (DOCKER_AMD64_RUNNER, USE_VPS_RUNNER off), and that silently skipped this job after both
    # images built (run 41703618029, 2026-11-03).
    if: >-
      !cancelled() && github.event_name != 'schedule' &&
      needs.prepare.result == 'success' && needs.build.result == 'success' &&
      needs.prepare.outputs.skip != 'true' &&
      (github.event_name != 'schedule' || github.repository == 'cheaper-inference/OmniRoute')
    # On Blacksmith with the amd64 build; on hosted once the monthly budget is spent.
    runs-on: ${{ needs.prepare.outputs.blacksmith == 'true' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      IMAGE_NAME: diegosouzapw/omniroute
      GHCR_IMAGE_NAME: ghcr.io/cheaper-inference/omniroute
      VERSION: ${{ needs.prepare.outputs.version }}
      PROMOTE_LATEST: ${{ needs.prepare.outputs.promote_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Manifest validation must use the current workflow's helper on backfills.
          # Manifests, smoke test and scans read no git history.
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download base digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-base-*
          path: /tmp/digests/base
          merge-multiple: true

      - name: Download web digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-web-*
          path: /tmp/digests/web
          merge-multiple: true

      - name: Download bun-base digests
        # Non-blocking: the bun image is best-effort, so its artifact may not
        # exist at all. The guard below decides whether its tag is published.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-bun-base-*
          path: /tmp/digests/bun-base
          merge-multiple: true

      - name: Download bun-web digests
        # Non-blocking: the bun image is best-effort, so its artifact may not
        # exist at all. The guard below decides whether its tag is published.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-bun-web-*
          path: /tmp/digests/bun-web
          merge-multiple: true

      - name: Guard against stale digests
        id: digests
        run: |
          set -euo pipefail
          # Validate every flavor in both registries BEFORE moving any public tag.
          # Counting alone cannot distinguish two AMD64 images from AMD64 + ARM64.
          pair_is_valid() {
            local dir="$1" image digest_file
            local refs
            for image in "$IMAGE_NAME" "$GHCR_IMAGE_NAME"; do
              refs=()
              while IFS= read -r digest_file; do
                refs+=("${image}@sha256:$(basename "$digest_file")")
              done < <(find "$dir" -type f | sort)
              node scripts/ci/docker-image-complete.mjs "${refs[@]}" || return 1
            done
          }

          # Node and Web are mandatory: anything but a valid pair stops the publish.
          for dir in base web; do
            if [ ! -d "/tmp/digests/$dir" ]; then
              echo "Missing digest directory: $dir" >&2
              exit 1
            fi
            count=$(find "/tmp/digests/$dir" -type f | wc -l)
            if [ "$count" -gt 2 ] || [ "$count" -lt 2 ]; then
              echo "digests in $dir: found $count, expected exactly 2 (amd64 + arm64)" >&2
              exit 1
            fi
            if ! pair_is_valid "/tmp/digests/$dir"; then
              echo "digests in $dir: the pair is not one linux/amd64 + one linux/arm64 in both registries" >&2
              exit 1
            fi
          done

          # Bun is best-effort but all-or-nothing per flavor: both architectures valid
          # in both registries publish the tag; anything else warns and publishes none.
          for dir in bun-base bun-web; do
            problem=""
            if [ ! -d "/tmp/digests/$dir" ]; then
              problem="no digests"
            else
              count=$(find "/tmp/digests/$dir" -type f | wc -l)
              if [ "$count" -gt 2 ] || [ "$count" -lt 2 ]; then
                problem="found $count digests, expected exactly 2 (amd64 + arm64)"
              elif ! pair_is_valid "/tmp/digests/$dir"; then
                problem="the pair is not one linux/amd64 + one linux/arm64 in both registries"
              fi
            fi
            publish="true"
            if [ -n "$problem" ]; then
              publish="false"
              echo "::warning::Not publishing the $dir image: $problem. Bun is best-effort; the Node and Web images are unaffected."
            fi
            echo "publish_${dir//-/_}=$publish" >> "$GITHUB_OUTPUT"
          done

      - name: Create Docker Hub version manifests
        env:
          PUBLISH_BUN_BASE: ${{ steps.digests.outputs.publish_bun_base }}
          PUBLISH_BUN_WEB: ${{ steps.digests.outputs.publish_bun_web }}
        run: |
          set -euo pipefail

          create_manifest() {
            local image="$1" suffix="$2" dir="$3"
            local refs=()
            while IFS= read -r digest_file; do
              refs+=("${image}@sha256:$(basename "$digest_file")")
            done < <(find "$dir" -type f | sort)
            node scripts/ci/docker-image-complete.mjs "${refs[@]}" || return 1
            docker buildx imagetools create -t "${image}:${VERSION}${suffix}" "${refs[@]}" || return 1
          }

          # A failed Bun manifest warns and never stops the mandatory tags.
          create_bun_manifest() {
            local publish="$1" image="$2" suffix="$3" dir="$4"
            if [ "$publish" != "true" ]; then
              return 0
            fi
            if ! create_manifest "$image" "$suffix" "$dir"; then
              echo "::warning::Could not publish ${image}:${VERSION}${suffix}. Bun is best-effort; continuing."
            fi
          }

          create_manifest "${IMAGE_NAME}" "" /tmp/digests/base
          create_manifest "${IMAGE_NAME}" "-web" /tmp/digests/web
          create_bun_manifest "${PUBLISH_BUN_BASE:-false}" "${IMAGE_NAME}" "-bun" /tmp/digests/bun-base
          create_bun_manifest "${PUBLISH_BUN_WEB:-false}" "${IMAGE_NAME}" "-web-bun" /tmp/digests/bun-web

      - name: Create GHCR version manifests
        env:
          PUBLISH_BUN_BASE: ${{ steps.digests.outputs.publish_bun_base }}
          PUBLISH_BUN_WEB: ${{ steps.digests.outputs.publish_bun_web }}
        run: |
          set -euo pipefail

          create_manifest() {
            local image="$1" suffix="$2" dir="$3"
            local refs=()
            while IFS= read -r digest_file; do
              refs+=("${image}@sha256:$(basename "$digest_file")")
            done < <(find "$dir" -type f | sort)
            node scripts/ci/docker-image-complete.mjs "${refs[@]}" || return 1
            docker buildx imagetools create -t "${image}:${VERSION}${suffix}" "${refs[@]}" || return 1
          }

          # A failed Bun manifest warns and never stops the mandatory tags.
          create_bun_manifest() {
            local publish="$1" image="$2" suffix="$3" dir="$4"
            if [ "$publish" != "true" ]; then
              return 0
            fi
            if ! create_manifest "$image" "$suffix" "$dir"; then
              echo "::warning::Could not publish ${image}:${VERSION}${suffix}. Bun is best-effort; continuing."
            fi
          }

          create_manifest "${GHCR_IMAGE_NAME}" "" /tmp/digests/base
          create_manifest "${GHCR_IMAGE_NAME}" "-web" /tmp/digests/web
          create_bun_manifest "${PUBLISH_BUN_BASE:-false}" "${GHCR_IMAGE_NAME}" "-bun" /tmp/digests/bun-base
          create_bun_manifest "${PUBLISH_BUN_WEB:-false}" "${GHCR_IMAGE_NAME}" "-web-bun" /tmp/digests/bun-web

      - name: Smoke-test published Docker image
        if: needs.prepare.outputs.version != 'main'
        run: |
          set -euo pipefail
          container="omniroute-smoke-${VERSION//[^a-zA-Z0-9_.-]/-}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" "${IMAGE_NAME}:${VERSION}"
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ] || [ "$(docker inspect --format '{{.State.Status}}' "$container")" = "exited" ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 2
          done
          docker logs "$container"
          exit 1

      - name: Promote Docker Hub latest tags
        if: needs.prepare.outputs.promote_latest == 'true'
        env:
          PUBLISH_BUN_BASE: ${{ steps.digests.outputs.publish_bun_base }}
          PUBLISH_BUN_WEB: ${{ steps.digests.outputs.publish_bun_web }}
        run: |
          set -euo pipefail
          promote_tag() {
            local suffix="$1"
            docker buildx imagetools create -t "${IMAGE_NAME}:latest${suffix}" "${IMAGE_NAME}:${VERSION}${suffix}"
          }
          # Validate every source before promoting any flavor. The mandatory tags must be
          # complete; a Bun alias moves only for a complete tag published by this run.
          for suffix in "" -web; do
            node scripts/ci/docker-image-complete.mjs "${IMAGE_NAME}:${VERSION}${suffix}"
          done
          bun_aliases=()
          add_bun_alias() {
            local publish="$1" suffix="$2"
            if [ "$publish" = "true" ] && node scripts/ci/docker-image-complete.mjs "${IMAGE_NAME}:${VERSION}${suffix}"; then
              bun_aliases+=("$suffix")
            else
              echo "::warning::Not promoting ${IMAGE_NAME}:latest${suffix}: this run has no complete Bun image for it."
            fi
          }
          add_bun_alias "${PUBLISH_BUN_BASE:-false}" -bun
          add_bun_alias "${PUBLISH_BUN_WEB:-false}" -web-bun
          for suffix in "" -web; do
            promote_tag "$suffix"
          done
          for suffix in "${bun_aliases[@]}"; do
            promote_tag "$suffix" || echo "::warning::Could not promote ${IMAGE_NAME}:latest${suffix}. Bun is best-effort; continuing."
          done

      - name: Promote GHCR latest tags
        if: needs.prepare.outputs.promote_latest == 'true'
        env:
          PUBLISH_BUN_BASE: ${{ steps.digests.outputs.publish_bun_base }}
          PUBLISH_BUN_WEB: ${{ steps.digests.outputs.publish_bun_web }}
        run: |
          set -euo pipefail
          promote_tag() {
            local suffix="$1"
            docker buildx imagetools create -t "${GHCR_IMAGE_NAME}:latest${suffix}" "${GHCR_IMAGE_NAME}:${VERSION}${suffix}"
          }
          for suffix in "" -web; do
            node scripts/ci/docker-image-complete.mjs "${GHCR_IMAGE_NAME}:${VERSION}${suffix}"
          done
          bun_aliases=()
          add_bun_alias() {
            local publish="$1" suffix="$2"
            if [ "$publish" = "true" ] && node scripts/ci/docker-image-complete.mjs "${GHCR_IMAGE_NAME}:${VERSION}${suffix}"; then
              bun_aliases+=("$suffix")
            else
              echo "::warning::Not promoting ${GHCR_IMAGE_NAME}:latest${suffix}: this run has no complete Bun image for it."
            fi
          }
          add_bun_alias "${PUBLISH_BUN_BASE:-false}" -bun
          add_bun_alias "${PUBLISH_BUN_WEB:-false}" -web-bun
          for suffix in "" -web; do
            promote_tag "$suffix"
          done
          for suffix in "${bun_aliases[@]}"; do
            promote_tag "$suffix" || echo "::warning::Could not promote ${GHCR_IMAGE_NAME}:latest${suffix}. Bun is best-effort; continuing."
          done

      - name: Inspect image
        if: needs.prepare.outputs.version != 'main'
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}"

      - name: Generate CycloneDX SBOM (image, advisory)
        if: needs.prepare.outputs.version != 'main'
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.GHCR_IMAGE_NAME }}:${{ env.VERSION }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          artifact-name: sbom-image.cdx.json

      # Visibility scan: reports HIGH + CRITICAL into the SARIF (Security tab) but
      # never blocks (exit-code 0). The blocking gate below narrows to CRITICAL.
      #
      # ignore-unfixed mirrors the blocking gate: the Security tab must surface only
      # ACTIONABLE vulnerabilities — ones with a published fix we can pull by rebuilding
      # on a patched base or bumping the dep. Without it the advisory upload floods the
      # tab with unfixable base-image OS CVEs (Debian trixie packages with no upstream
      # patch yet, overwhelmingly local-only and not reachable from the proxy request
      # surface), which is noise an operator cannot act on. trivyignores points at the
      # repo-root .trivyignore so accepted-risk fixable CVEs have one auditable home.
      # See docs/security/SUPPLY_CHAIN.md.
      - name: Trivy image scan (SARIF, advisory)
        if: needs.prepare.outputs.version != 'main'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE_NAME }}:${{ env.VERSION }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"

      # BLOCKING gate (v3.8.27 cycle-end): fail the release on a CRITICAL CVE in the
      # published image. Narrowed to severity CRITICAL (HIGH stays visible in the
      # SARIF step above, not blocking). ignore-unfixed:true so an unfixable base-image
      # CVE with no upstream patch does not red the release (reduces false-blocks);
      # a fixable CRITICAL still blocks. Per docs/security/SUPPLY_CHAIN.md. NB: Trivy
      # scans against a CVE DB that grows continuously — a newly-disclosed CRITICAL on
      # an unchanged base image can red this gate; the fix is to rebuild on a patched
      # base, bump the dep, or add a justified .trivyignore entry (see the CVE-variance
      # note in docs/security/SUPPLY_CHAIN.md).
      - name: Trivy CRITICAL gate (blocking)
        if: needs.prepare.outputs.version != 'main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE_NAME }}:${{ env.VERSION }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # Explicit: the advisory scan above already points at it, and the blocking
          # gate must honour the same accepted-risk list (#12084).
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF to Security tab
        if: needs.prepare.outputs.version != 'main'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Update Docker Hub description
        # Only refresh README/description when we actually promote :latest
        # (avoids overwriting from main, next, or back-fill builds).
        if: needs.prepare.outputs.promote_latest == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: diegosouzapw/omniroute
          short-description: "OmniRoute — Unified AI proxy. Route any LLM through one endpoint."
          readme-filepath: ./README.md

  # #14560: alert when the only omni-build runner goes offline. Mirrors the
  # nightly-release-green issue loop: open a deduplicated tracking issue when
  # no online runner carries the label, comment with fresh evidence while it
  # persists, and auto-close it when the pool recovers. Without this, an
  # offline box is only discovered the next time a publish silently stalls.
  runner-alert:
    name: omni-build runner offline alert
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.USE_VPS_RUNNER == 'true' && vars.USE_VPS_BUILD_RUNNER == 'true' &&
      (github.event_name != 'schedule' || github.repository == 'cheaper-inference/OmniRoute')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open/update/close the tracking issue
        env:
          # Issue writes use GITHUB_TOKEN (issues: write); only the runner listing
          # needs RUNNER_STATUS_TOKEN (see runner-preflight). Without it the check is
          # skipped with a warning instead of opening/closing the issue on bad data.
          GH_TOKEN: ${{ github.token }}
          RUNNERS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN || github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Docker publish runner offline: no online omni-build runner"
          if ! ONLINE=$(GH_TOKEN="$RUNNERS_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/actions/runners" \
            --paginate --jq '[.runners[] | select(.status == "online") | select(any(.labels[]; .name == "omni-build"))] | length'); then
            echo "::warning::Could not list self-hosted runners (token lacks Administration read — set the RUNNER_STATUS_TOKEN secret). Alert skipped."
            exit 0
          fi
          echo "online omni-build runners: ${ONLINE}"

          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title ${TITLE}" --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ "${ONLINE}" -eq 0 ]; then
            {
              echo "No **online** runner carries the \`omni-build\` label (\`GET /repos/{owner}/{repo}/actions/runners\`)."
              echo ""
              echo "While this persists, every Docker publish with \`USE_VPS_RUNNER=true\` queues the amd64 build forever - the silent stall from #14560 (the runner-preflight job turns it into a red run at publish time; this issue is the standing signal between publishes)."
              echo ""
              echo "**Checked:** ${RUN_URL} at \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`"
              echo ""
              echo "_Auto-managed by the Publish to Docker Hub schedule - closes itself when a runner comes back online._"
            } > issue-body.md
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
              echo "Updated existing issue #$EXISTING"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file issue-body.md
              echo "Created tracking issue"
            fi
          elif [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --reason completed \
              --comment "OK: ${ONLINE} online \`omni-build\` runner(s) - pool recovered. Auto-closed."
            echo "Closed issue #$EXISTING"
          else
            echo "Pool healthy (${ONLINE} online), nothing to do"
          fi
