name: Compression Runtime Integrity
on:
  pull_request:
    branches: ["main", "release/**"]
    paths:
      - "open-sse/services/compression/**"
      - "open-sse/handlers/chatCore/sessionPromptCacheKey.ts"
      - "bin/cli/runtime/**"
      - "scripts/build/runtime-env.mjs"
      - "scripts/test/check-compression-packaged-runtime.mjs"
      - "tests/fixtures/compression-packaged-runtime/**"
      - "tests/unit/cache-diagnostics-runtime.test.mjs"
      - "tests/unit/token-breakdown-*.test.mjs"
      - "package*.json"
      - ".github/workflows/compression-integrity.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packaged-runtime:
    name: Packaged compression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - uses: ./.github/actions/npm-ci-retry
      - name: Private diagnostics and disposable-worker regressions
        run: node --test tests/unit/cache-diagnostics-runtime.test.mjs tests/unit/token-breakdown-content.test.mjs tests/unit/token-breakdown-lifecycle.test.mjs
      - name: Real Turbopack pool in an installation path with spaces
        run: npm run test:compression:packaged
