name: opencode-plugin CI

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "@omniroute/opencode-plugin/**"
      - "@omniroute/opencode-plugin-v2/**"
      - ".github/workflows/opencode-plugin-ci.yml"
      - "config/ci/toolchain.json"
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "@omniroute/opencode-plugin/**"
      - "@omniroute/opencode-plugin-v2/**"
      - ".github/workflows/opencode-plugin-ci.yml"
      - "config/ci/toolchain.json"
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: "@omniroute/opencode-plugin"

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.4", "24.22.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node }}
      - name: Select the lockfile-compatible npm version
        id: npm
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          expected=$(node -p "require('./config/ci/toolchain.json').npm")
          if ! [[ "$expected" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid pinned npm version" >&2
            exit 1
          fi
          if [ "$(npm --version)" != "$expected" ]; then
            npm install --global "npm@$expected" --no-audit --no-fund
          fi
          actual=$(npm --version)
          if [ "$actual" != "$expected" ]; then
            echo "npm version differs from the lockfile toolchain" >&2
            exit 1
          fi
          echo "version=$actual" >> "$GITHUB_OUTPUT"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test

  test-v2:
    name: Test v2 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.4", "24.22.1"]
    defaults:
      run:
        working-directory: "@omniroute/opencode-plugin-v2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node }}
      - name: Select the lockfile-compatible npm version
        id: npm
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          expected=$(node -p "require('./config/ci/toolchain.json').npm")
          if ! [[ "$expected" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid pinned npm version" >&2
            exit 1
          fi
          if [ "$(npm --version)" != "$expected" ]; then
            npm install --global "npm@$expected" --no-audit --no-fund
          fi
          actual=$(npm --version)
          if [ "$actual" != "$expected" ]; then
            echo "npm version differs from the lockfile toolchain" >&2
            exit 1
          fi
          echo "version=$actual" >> "$GITHUB_OUTPUT"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, test-v2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          package-manager-cache: false
          node-version: "24.22.1"
      - name: Select the lockfile-compatible npm version
        id: npm
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          expected=$(node -p "require('./config/ci/toolchain.json').npm")
          if ! [[ "$expected" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid pinned npm version" >&2
            exit 1
          fi
          if [ "$(npm --version)" != "$expected" ]; then
            npm install --global "npm@$expected" --no-audit --no-fund
          fi
          actual=$(npm --version)
          if [ "$actual" != "$expected" ]; then
            echo "npm version differs from the lockfile toolchain" >&2
            exit 1
          fi
          echo "version=$actual" >> "$GITHUB_OUTPUT"
      - name: Build plugin-v2 artifact
        working-directory: "@omniroute/opencode-plugin-v2"
        run: npm ci --no-audit --no-fund && npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: opencode-plugin-v2-dist
          path: "@omniroute/opencode-plugin-v2/dist"
          retention-days: 7
