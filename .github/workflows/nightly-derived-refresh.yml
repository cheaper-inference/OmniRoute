name: Nightly derived refresh

# Plan "derived numbers and texts resolved only at release" (2026-11-13). A feature PR never
# writes a value that depends on the state of its base — provider / migration / MCP-tool counts,
# the version claims, the README SVG numbers, the facts snapshot (docs/reference/
# derived-facts.json). `npm run release:refresh-derived` recomputes all of them in one pass; the
# release runs it, and between releases this workflow runs it once a day on the highest
# release/vX.Y.Z and keeps a pull request open for each group of refreshed files. The counts
# gate lets these PRs edit managed numbers because
# `chore/derived-*` is a writer branch (scripts/check/lib/derivedClaimsDiff.mjs).
#
# This workflow skips a branch under release-freeze (Hard Rule #21).
# When enabled, derived-refresh-autoland applies the queue label after checking the PR files,
# current head gates, release freeze and base health.
#
# The robot uses chore/derived-refresh for unprotected files and chore/derived-refresh-protected
# for protected files. Each branch gets one commit from the same release tip with a lease pinned
# to the remote SHA. The robot leaves branches with manually pushed tips alone.
#
# PR token: DERIVED_REFRESH_PR_TOKEN when set (fine-grained token on this repository, Contents
# and Pull requests: write), else I18N_REFRESH_TOKEN — the robot token the i18n mirror refresh
# already opens its PR with (same scopes, same purpose; owner decision 2026-11-13). This repository
# does not let GITHUB_TOKEN create PRs, and a branch pushed or a PR opened with GITHUB_TOKEN
# does not trigger CI, so the refresh PR would sit without checks. With neither secret the branch
# is still pushed (with GITHUB_TOKEN) and the run summary says to open the PR by hand.
#
# Secrets and event values reach the scripts only through `env:`.

on:
  schedule:
    - cron: "37 1 * * *" # 01:37 UTC daily, a slot no other workflow uses
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-derived-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh derived numbers on the active release branch
    if: ${{ github.event_name != 'schedule' || github.repository == 'cheaper-inference/OmniRoute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # push the refresh branches when no PR token is configured
      pull-requests: write # find, update and retarget the refresh PRs
      issues: read # release-freeze and base-red lookups
    env:
      REFRESH_BRANCH: chore/derived-refresh
      PROTECTED_BRANCH: chore/derived-refresh-protected
      BOT_NAME: github-actions[bot]
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Resolve the active release branch and the release freeze
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=$(gh api "repos/$GITHUB_REPOSITORY/branches" --paginate --jq '.[].name' \
            | grep -E '^release/v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          [ -n "$BASE" ] || { echo "no release/vX.Y.Z branch" >&2; exit 1; }
          # A freeze issue is titled "🔒 release-freeze: vX.Y.Z in progress"; v3.8.5 must not
          # match v3.8.52, and a freeze that names no version freezes everything.
          VER_RE=$(printf '%s' "${BASE#release/}" | sed 's/\./\\./g')
          # A checked assignment: a failed lookup fails the step. Fed through `< <(gh ...)`, the
          # failure was invisible to set -e, the loop read EOF and the run went on as not frozen.
          FREEZES=$(gh issue list --repo "$GITHUB_REPOSITORY" --label release-freeze --state open \
            --json number,title --jq '.[] | "\(.number)\t\(.title)"')
          FROZEN=""
          while IFS=$'\t' read -r NUM TITLE; do
            [ -n "$NUM" ] || continue
            if printf '%s' "$TITLE" | grep -qE "(^|[^0-9.])${VER_RE}([^0-9]|$)" \
              || ! printf '%s' "$TITLE" | grep -qE 'v[0-9]+\.[0-9]+\.[0-9]+'; then
              FROZEN="#$NUM"
            fi
          done <<< "$FREEZES"
          RED=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "Release branch not green: $BASE in:title" --json number --jq '.[0].number // empty')
          {
            echo "branch=$BASE"
            echo "skip=$([ -n "$FROZEN" ] && echo true || echo false)"
            echo "red=$RED"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$FROZEN" ]; then
            echo "::notice::$BASE is under release-freeze ($FROZEN) — the release refreshes it."
            echo "Skipped: \`$BASE\` is under release-freeze ($FROZEN)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Target branch: \`$BASE\` (base-red: ${RED:-none})" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.base.outputs.skip == 'false'
        with:
          ref: ${{ steps.base.outputs.branch }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.base.outputs.skip == 'false'
        with:
          package-manager-cache: false
          node-version: "24"

      - uses: ./.github/actions/npm-ci-retry
        if: steps.base.outputs.skip == 'false'
        with:
          cache: false

      # UI keys added or rewritten since the last release are translated in the same run: the
      # refresh never writes __MISSING__ markers without a backend (they fail
      # i18n-vi-completeness and the ratio gate on the base). Same engine rule as
      # i18n-mirror-refresh.yml: the LLM chain when it is fully configured, else the
      # structure-safe Google engine, which needs no endpoint and runs on a hosted runner.
      - name: Refresh derived numbers
        if: steps.base.outputs.skip == 'false'
        env:
          OMNIROUTE_TRANSLATION_API_KEY: ${{ secrets.OMNIROUTE_TRANSLATION_API_KEY }}
          OMNIROUTE_TRANSLATION_API_URL: ${{ secrets.OMNIROUTE_TRANSLATION_API_URL || vars.OMNIROUTE_TRANSLATION_API_URL }}
          OMNIROUTE_TRANSLATION_MODEL: ${{ vars.OMNIROUTE_TRANSLATION_MODEL }}
          OMNIROUTE_TRANSLATION_FALLBACK_MODELS: ${{ vars.OMNIROUTE_TRANSLATION_FALLBACK_MODELS }}
          OMNIROUTE_TRANSLATION_GOOGLE_API_KEY: ${{ secrets.OMNIROUTE_TRANSLATION_GOOGLE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$OMNIROUTE_TRANSLATION_API_KEY" ] && [ -n "$OMNIROUTE_TRANSLATION_API_URL" ] \
            && [ -n "$OMNIROUTE_TRANSLATION_MODEL" ]; then
            export OMNIROUTE_TRANSLATION_ENGINE="llm"
          else
            export OMNIROUTE_TRANSLATION_ENGINE="google"
          fi
          export OMNIROUTE_TRANSLATION_GOOGLE_FALLBACK="1"
          echo "Translation engine: \`$OMNIROUTE_TRANSLATION_ENGINE\`" >> "$GITHUB_STEP_SUMMARY"
          npm run release:refresh-derived -- --profile=nightly

      - name: Split the refreshed files and publish the PRs
        if: steps.base.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.DERIVED_REFRESH_PR_TOKEN || secrets.I18N_REFRESH_TOKEN || github.token }}
          HAS_PR_TOKEN: ${{ secrets.DERIVED_REFRESH_PR_TOKEN != '' || secrets.I18N_REFRESH_TOKEN != '' }}
          BASE: ${{ steps.base.outputs.branch }}
          BASE_RED_ISSUE: ${{ steps.base.outputs.red }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git add -A
          BASE_SHA=$(git rev-parse HEAD)
          REFRESH_TREE=$(git write-tree)
          export BASE_SHA REFRESH_TREE
          refresh_dir=$(mktemp -d "$RUNNER_TEMP/derived-refresh.XXXXXX")

          # Treat renames as a deletion and an addition so both paths are classified.
          git diff --cached --name-only --no-renames -z | LC_ALL=C sort -z > "$refresh_dir/all"
          node scripts/release/derived-refresh-split.mjs --null < "$refresh_dir/all" > "$refresh_dir/protected"
          LC_ALL=C comm -z -23 "$refresh_dir/all" "$refresh_dir/protected" > "$refresh_dir/unprotected"

          cat > "$refresh_dir/main.md" <<EOF
          ## Summary

          Nightly refresh of the derived numbers on \`$BASE\`. The refresh recomputed counts, version claims, README SVG numbers, and the facts snapshot from the live code ([run]($RUN_URL)).

          The robot rebuilds \`$REFRESH_BRANCH\` from \`$BASE\` on every run.

          ## Queue admission

          When enabled, \`derived-refresh-autoland\` applies the \`omni-queue\` label after these checks.

          - [ ] \`Gate / CI\` and \`Gate / Quality\` passed on the current head.
          - [ ] Every changed file belongs to a derived family or is \`README.md\` with only digits changed.
          - [ ] All paths are unprotected. Protected files go to the PR from \`$PROTECTED_BRANCH\`.
          - [ ] The latest release branch has no open base-red issue and no release freeze is open.
          - [ ] The PR is open, ready for review and free of queue or blocking labels.
          EOF

          cat > "$refresh_dir/protected.md" <<EOF
          ## Summary

          Nightly refresh of protected files on \`$BASE\` ([run]($RUN_URL)).

          This PR touches agent-instruction surfaces and requires the owner's explicit approval before merge. Autoland never applies the \`omni-queue\` label to this PR.

          The robot rebuilds \`$PROTECTED_BRANCH\` from \`$BASE\` on every run.
          EOF

          gh auth setup-git
          bash scripts/release/derived-refresh-publish.sh "$REFRESH_BRANCH" \
            "chore(docs): refresh derived numbers on ${BASE}" "$refresh_dir/main.md" "$refresh_dir/unprotected"
          bash scripts/release/derived-refresh-publish.sh "$PROTECTED_BRANCH" \
            "chore(docs): refresh generated agent-instruction files on ${BASE}" "$refresh_dir/protected.md" "$refresh_dir/protected"
